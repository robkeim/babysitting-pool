# ADR 0008: every job calls the same commands as scripts/check.sh. `ci-ok` is the only required check.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'src/backend/**'
              - 'tests/**'
              - '.editorconfig'
              - 'global.json'
              - 'Directory.*.props'
              - 'docs/api/openapi.json'
              - 'scripts/check.sh'
              - '.github/workflows/ci.yml'
            frontend:
              - 'src/frontend/**'
              - '.nvmrc'
              - 'docs/api/**'
              - 'scripts/check.sh'
              - '.github/workflows/ci.yml'

  # The ready_for_review run exists only to add e2e (skipped while a PR is a draft); the other jobs already
  # passed on this SHA, so they are skipped there instead of repeated.
  pr-title:
    if: github.event_name == 'pull_request' && github.event.action != 'ready_for_review'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    needs: changes
    if: github.event.action != 'ready_for_review' && needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-
      # Runs format, build and every test, including OpenApiDocumentTests, which fails when
      # docs/api/openapi.json drifts from the API (ADR 0006).
      - run: scripts/check.sh backend

  frontend:
    needs: changes
    if: github.event.action != 'ready_for_review' && needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
        working-directory: src/frontend
      - run: scripts/check.sh frontend
      - name: Postman collection is up to date
        working-directory: src/frontend
        run: |
          npm run generate:postman
          git diff --exit-code -- ../../docs/api/postman_collection.json \
            || { echo "::error::docs/api/postman_collection.json is stale; run 'npm run generate:postman' in src/frontend"; exit 1; }

  e2e:
    needs: changes
    # Once the PR is ready for review; drafts and pushes to main run only the cheap jobs.
    if: >-
      github.event_name == 'pull_request' && !github.event.pull_request.draft &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
        working-directory: src/frontend
      - name: Read Playwright version
        id: playwright
        working-directory: src/frontend
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        working-directory: src/frontend
        run: |
          if [ "${{ steps.browsers.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi
      # The journeys build the backend themselves in global setup.
      - run: npx playwright test
        working-directory: src/frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: src/frontend/test-results
          retention-days: 7

  # A cache saved by a PR run is visible only to that PR, and e2e never runs on main, so without this every
  # PR downloads Chromium cold. Saving it from main makes it readable by every PR.
  warm-playwright-cache:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
        working-directory: src/frontend
      - name: Read Playwright version
        id: playwright
        working-directory: src/frontend
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        working-directory: src/frontend
        run: npx playwright install chromium

  ci-ok:
    # Always runs, so a path-filtered job that was skipped never leaves a required check pending.
    if: always()
    needs: [changes, pr-title, backend, frontend, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any job failed or was cancelled
        run: |
          echo '${{ toJSON(needs) }}'
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then exit 1; fi
