# One always-on Machine in iad with a volume for the database (ADR 0018).
# SQLite is single-instance, so never scale past one Machine.
app = "babysitting-pool"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[mounts]
  source = "data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
